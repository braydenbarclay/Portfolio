---
layout: design
title: "Photography Projects"
---

<div class="design-grid">
    {% for tag in design.tags %}
      <div class="design-card">
        <h2>{{ design.tag }}</h2>
        {% if design.tools %}
          <p><strong>Tools:</strong> {{ design.tools | join: ", " }}</p>
        {% endif %}
        {% if design.description %}
          <p>{{ design.description }}</p>
        {% endif %}
        <a href="{{ site.baseurl }}/{{ design.url }}">View Folder →</a>
      </div>
    {% endfor %}
  </div>
